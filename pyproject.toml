[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-llm-benchmark"
version = "0.1.0"
description = "Benchmarking suite for LLM-hosted apps comparing With-JEV vs Without-JEV using Sarvam AI 105B and OpenAI fallback under RBAC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "selenium: Automated browser E2E tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "__pycache__"]
